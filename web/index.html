<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Qwen Base AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #172033;
        }

        header {
            background: #ffffff;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            color: #2563eb;
            margin: 0 0 10px;
        }

        header p {
            color: #64748b;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .model-info {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .model-info h2 {
            margin-top: 0;
        }

        .model-name {
            color: #2563eb;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 850px;
            border: none;
            border-radius: 12px;
            background: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

    </style>
</head>

<body>

    <header>

        <h1>Qwen Base AI</h1>

        <p>
            AI Text Generation Application
        </p>

    </header>

    <main>

        <section class="model-info">

            <h2>About the Model</h2>

            <p>
                This application uses the original
                pretrained Qwen model.
            </p>

            <p>
                Model:
                <span class="model-name">
                    Qwen/Qwen2.5-0.5B
                </span>
            </p>

            <p>
                Enter a prompt below to generate a response.
            </p>

        </section>

        <iframe
            src="https://sajida12-qwen-base-model-api.hf.space"
            title="Qwen Base AI Application"
            loading="lazy">
        </iframe>

    </main>

    <footer>

        Qwen Base AI | Powered by Hugging Face

    </footer>

</body>
</html>
